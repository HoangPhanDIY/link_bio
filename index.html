<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, "fetch", {
            get: function () {
              return currentFetch;
            },
            set: function (val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          console.warn("Could not patch window.fetch:", e);
        }
        try {
          var originalFetchGT = globalThis.fetch;
          var currentFetchGT = originalFetchGT;
          Object.defineProperty(globalThis, "fetch", {
            get: function () {
              return currentFetchGT;
            },
            set: function (val) {
              currentFetchGT = val;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          console.warn("Could not patch globalThis.fetch:", e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link HoangAoNhay</title>

    <!-- 1. Favicon cho Tab trình duyệt (Máy tính & Trình duyệt di động) -->
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png" />

    <!-- 2. Icon cho iOS (iPhone/iPad) khi Thêm vào màn hình chính -->
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png" />

    <!-- 3. Màu thanh trạng thái/tiêu đề trên trình duyệt di động -->
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
